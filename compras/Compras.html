<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos DaRoça</title>
    <link id="header">
    <link id="footer">
    <link rel="stylesheet" href="compras.css">
</head>
<body>


    <header id="cabecalho"></header>

    <main>
        <h1 class="titulo_pagina">Categorias</h1>
        <section id="categorias">  
            <div>
                <button class="botao-categorias" onclick="filtrarCategoria('TODOS')">
                <img src="imagens/icone_todos.png" alt="Frutas" class ="icone_categorias">
                <img src="imagens/FLV.jpg" class="imagem_icone">
                <span class="titulo">TODOS</span>
                </button>
            </div>
            <div>
                <button class="botao-categorias" onclick="filtrarCategoria(1)">
                <img src="imagens/icone_frutas.png" alt="Frutas" class ="icone_categorias">
                <img src="imagens/Frutas.jpg" class="imagem_icone">
                <span class="titulo">FRUTAS</span>
                </button>
            </div>
            <div>
                <button class="botao-categorias" onclick="filtrarCategoria(2)">
                <img src="imagens/icone_legumes.png" alt="Legumes" class ="icone_categorias">
                <img src="imagens/Legumes.jpg" class="imagem_icone">
                <span class="titulo">LEGUMES</span>
                </button>
            </div>
            <div>
                <button class="botao-categorias" onclick="filtrarCategoria(3)">
                <img src="imagens/icone_verduras.png" class ="icone_categorias"alt="Verudas">
                <img src="imagens/verduras.jpg" class="imagem_icone">
                <span class="titulo">VERDURAS</span>
                </button>
            </div>
        </section >

        <h1 class="titulo_pagina">Produtos</h1>
        <section id="produtos">
            
        </section>
    </main>

    <footer id="rodape"></footer> 

    <script src="../main.js"></script>
    <script src="compras.js"></script>
    <script src="../header/header.js"></script>
</body>
</html>
