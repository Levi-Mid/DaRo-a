<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro DaRoça</title>
    <link rel="stylesheet" href="stylecadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
</head>
<body>
    <div id="content">
        <main id="esquerda">
            <header id="teste">
                <a href="/main.html"><button id="voltar"><</button></a>
            </header>
            <section id="slogan">
                <h1 class="league-gothic"><span>Da</span><span id="sloganverde">Roça</span></h1>
                <p id="frase">Direto para a sua casa</p>
            </section>
            <footer id="rodape">
                <h1 class="league-gothic">Cadastre-se agora</h1>
                <h1 class="league-gothic" id="textoverde">e colha vantagens.</h1>
            </footer>
        </main>    
        <main id="direita">
            <header>
                <h2 id="cadastro">Cadastro</h2>
            </header>
            <section id="info">
                <h2>Cadastro Delivery DaRoça</h2>
                <h3>os campos marcados com (*) são obrigatórios</h3>
            </section>
            <div id="inputs">
                <div class="inputs"><input type="number" placeholder="CPF  *" id="cpf"></div>
                <div class="inputs"><input type="text" placeholder="Nome completo conforme o documento  *" id="nome"></div>
                <div class="inputs"><input type="text" placeholder="Apelido ou nome social" id="nomeSocial"></div>
                <div class="inputs"><input type="date" placeholder="Data de nascimento  *" id="nascimento"></div>
            </div>
            <footer>
                <button id="enviar" onclick="proximo()">Próximo</button>
            </footer>
        </main>
    </div>
    <script src="cadastro.js"></script>
</body>
